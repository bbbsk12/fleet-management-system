# ============================================================
# 总控电脑 Zenoh Router 配置文件
# 文件位置: 总控端 ~/zenoh_router_config.yaml
# ============================================================
#
# 启动命令:
#   zenohd -c ~/zenoh_router_config.yaml
#
# 或者简化启动 (使用默认配置):
#   zenohd
# ============================================================

# ==========================================
# Zenoh路由器模式
# ==========================================
mode: "peer"  # peer模式, 作为路由器

# ==========================================
# 监听配置 - 接受底盘连接
# ==========================================
listen: {
  endpoints: [
    # 监听所有网络接口
    "tcp/0.0.0.0:7447",
    # 如果需要UDP发现
    # "udp/0.0.0.0:7446",
  ]
}

# ==========================================
# 连接配置 (如果有其他路由器)
# ==========================================
connect: {
  endpoints: []
}

# ==========================================
# 插件配置 (可选)
# ==========================================
plugins: {
  # 如果需要REST API管理
  # rest: {
  #   http_port: 8000
  # },
  
  # 如果需要存储功能
  # storage_manager: {
  #   storages: {}
  # }
}

# ==========================================
# 路由配置
# ==========================================
routing: {
  # 路由器间传播模式
  router_peers_failover_brokering: true,
  # 允许客户端之间的直接通信
  gossip: {
    autoconnect: ["router", "peer"]
  }
}

# ==========================================
# 传输配置
# ==========================================
transport: {
  unicast: {
    accept_timeout: 10000,
    accept_pending: 100,
    max_sessions: 1000
  },
  link: {
    protocols: ["tcp"]
  }
}

# ==========================================
# 日志配置
# ==========================================
logging: {
  level: "info",
  format: "[${z.timestamp}] ${z.level} ${z.name} ${z.msg}"
}
